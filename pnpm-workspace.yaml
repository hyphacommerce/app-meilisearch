# Not a workspace: pnpm reads its settings from here. Hypha's SDK packages are linked
# from a checkout next to this one (`../hypha`), as package.json's `link:` entries say.

# Dependency install scripts run only when listed here (pnpm blocks them by default).
# workerd fetches the Workers runtime binary `wrangler dev` runs in; esbuild finds its
# binary in its platform package without its script.
allowBuilds:
  workerd: true
  esbuild: false
  sharp: false
